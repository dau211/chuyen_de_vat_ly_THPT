<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyên đề Vật lí THPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1437; --night2:#1b2a6b; --paper:#f3f6fc; --card:#ffffff; --ink:#16213e; --muted:#5d6b8a; --line:#dde4f2;
  --c10:#f59e0b; --c11:#0ea5a4; --c12:#e0527a;
  --sideW:330px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}

/* ===== Banner ===== */
.banner{position:relative;overflow:hidden;color:#fff;padding:34px 40px;
  background:radial-gradient(1200px 400px at 85% -20%,#3b4fd6 0%,transparent 60%),linear-gradient(120deg,var(--night),var(--night2));}
.banner h1{position:relative;z-index:2;font-size:clamp(26px,4.2vw,46px);font-weight:800;letter-spacing:.2px;line-height:1.15}
.banner p{position:relative;z-index:2;margin-top:8px;color:#b9c5f5;font-size:clamp(14px,1.6vw,17px)}
.atom{position:absolute;right:6%;top:50%;width:190px;height:190px;margin-top:-95px;z-index:1;opacity:.95}
.atom .orb{position:absolute;inset:0;border:2px solid rgba(160,190,255,.55);border-radius:50%;transform:rotate(var(--r)) scaleY(.36)}
.atom .orb i{position:absolute;top:50%;left:-6px;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--e);box-shadow:0 0 14px var(--e);
  animation:spin 5s linear infinite;animation-delay:var(--d);transform-origin:calc(95px + 6px) 6px;}
.atom .core{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;box-shadow:0 0 30px 8px rgba(120,170,255,.8)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Layout ===== */
.wrap{flex:1;display:flex;min-height:0}
.side{width:var(--sideW);flex:none;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:18px 14px 28px}
.side h2{font-size:15px;color:var(--muted);font-weight:600;margin:4px 8px 12px}

.grade{margin-bottom:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:#fff}
.grade button.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 14px;border:0;background:none;cursor:pointer;
  font:inherit;font-weight:700;font-size:16px;color:var(--ink);text-align:left}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;background:var(--c)}
.grade .count{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.grade.open .chev{transform:rotate(-135deg)}
.grade.open{border-color:var(--c);box-shadow:0 6px 18px -10px var(--c)}
.lessons{display:none;list-style:none;padding:2px 8px 10px;border-top:1px dashed var(--line)}
.grade.open .lessons{display:block}
.lessons li button{width:100%;display:flex;gap:10px;align-items:flex-start;padding:10px 10px;margin-top:4px;border:0;border-radius:10px;background:none;
  cursor:pointer;font:inherit;font-size:14.5px;line-height:1.4;color:var(--ink);text-align:left;transition:background .15s}
.lessons li button:hover{background:#eef2fb}
.lessons li button::before{content:"";flex:none;width:0;height:0;margin-top:5px;border-left:9px solid var(--c);border-top:6px solid transparent;border-bottom:6px solid transparent}
.lessons li.active button{background:var(--c);color:#fff;font-weight:600}
.lessons li.active button::before{border-left-color:#fff}
.lessons li.novideo button{color:var(--muted)}
.lessons li.active.novideo button{color:#fff}

/* ===== Player ===== */
.stage{flex:1;min-width:0;padding:26px 32px 36px;overflow-y:auto}
.crumb{font-size:14px;font-weight:600;color:var(--c,var(--muted))}
.stage h3{font-size:clamp(20px,2.6vw,30px);font-weight:800;margin:4px 0 16px;line-height:1.25}
.player{position:relative;width:100%;max-width:1000px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0b1437;
  box-shadow:0 24px 50px -22px rgba(11,20,55,.6),0 0 0 4px #fff}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c8d3fb;padding:24px;
  background:radial-gradient(500px 260px at 50% 40%,#2a3c92,transparent 70%),#0b1437}
.empty b{display:block;font-size:clamp(17px,2.4vw,24px);color:#fff;margin-bottom:6px}
.nav{max-width:1000px;display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.nav button{font:inherit;font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.nav button:hover:not(:disabled){background:var(--ink);color:#fff}
.nav button:disabled{opacity:.4;cursor:default}

button:focus-visible{outline:3px solid #6d8bff;outline-offset:2px}

.menuBtn{display:none}
@media (max-width:860px){
  .banner{padding:22px 20px}.atom{display:none}
  .wrap{flex-direction:column}
  .side{width:100%;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .stage{padding:18px 16px 30px;overflow:visible}
  .menuBtn{display:block;width:100%;margin-bottom:10px;padding:12px;border:0;border-radius:12px;background:var(--night2);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .side.collapsed .gradeList{display:none}
}
@media (prefers-reduced-motion:reduce){.atom .orb i{animation:none}}
</style>
</head>
<body>

<header class="banner">
  <h1>CHUYÊN ĐỀ VẬT LÝ THPT</h1>
  <p>Hệ thống bài giảng video theo từng khối lớp - Thiết lập Website: GV Đậu Nam Thành </p>
  <div class="atom" aria-hidden="true">
    <div class="orb" style="--r:0deg;--e:#ffd166;--d:0s"><i></i></div>
    <div class="orb" style="--r:60deg;--e:#5eead4;--d:-1.6s"><i></i></div>
    <div class="orb" style="--r:120deg;--e:#ff8fab;--d:-3.2s"><i></i></div>
    <div class="core"></div>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Danh mục chuyên đề">
    <button class="menuBtn" id="menuBtn">Danh mục bài học</button>
    <div class="gradeList" id="gradeList"></div>
  </nav>

  <main class="stage" id="stage">
    <div class="crumb" id="crumb"></div>
    <h3 id="title"></h3>
    <div class="player" id="player"></div>
    <div class="nav">
      <button id="prev">Bài trước</button>
      <button id="next">Bài sau</button>
    </div>
  </main>
</div>

<script>
/* =====================================================================
   CHỈNH SỬA TẠI ĐÂY: thêm tên bài và link YouTube cho từng chuyên đề.
   - title: tên bài    - url: dán link YouTube (watch, youtu.be hoặc embed đều được)
   - Để url là "" nếu chưa có video.
   - Muốn thêm bài: copy một dòng { title:"...", url:"..." } rồi dán thêm.
   ===================================================================== */
const DATA = [
  { id:"10", name:"Chuyên đề Vật lí 10", color:"#f59e0b", lessons:[
    { title:"Bài 1: Sơ lược về sự phát triển của Vật lí học (Phần 1)", url:"https://youtu.be/I6H_kpjRDNo" },
    { title:"Bài 1: Sơ lược về sự phát triển của Vật lí học (Phần 2)", url:"https://youtu.be/lWi5fOw1SP4" },
    { title:"Bài 1: Sơ lược về sự phát triển của Vật lí học (Phần 3)", url:"https://youtu.be/Y-2nVu-Cggs" }
  ]},
  { id:"11", name:"Chuyên đề Vật lí 11", color:"#0ea5a4", lessons:[
    { title:"Bài 1: Trường hấp dẫn (Phần 1)", url:"https://youtu.be/qYEvPrF0LSk" },
    { title:"Bài 1: Trường hấp dẫn (Phần 2)", url:"https://youtu.be/_FFOi9yUqP4" }
  ]},
  { id:"12", name:"Chuyên đề Vật lí 12", color:"#e0527a", lessons:[
    { title:"Bài 1: Đặc trưng của dòng điện xoay chiều", url:"https://youtu.be/ACa8w8fMvRY" },
    { title:"Bài 2: Tên bài mẫu (sửa lại)", url:"" }
  ]}
];
/* ===================== HẾT PHẦN CẦN CHỈNH SỬA ===================== */

function ytId(u){
  if(!u) return null;
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const flat = [];
DATA.forEach((g,gi)=>g.lessons.forEach((l,li)=>flat.push({gi,li})));
let cur = 0;

const $ = id => document.getElementById(id);
const list = $('gradeList');

DATA.forEach((g,gi)=>{
  const el = document.createElement('div');
  el.className = 'grade'; el.style.setProperty('--c', g.color); el.id = 'g'+gi;
  el.innerHTML = `<button class="head" aria-expanded="false">
      <span class="badge">${g.id}</span><span>${g.name}</span>
      <span class="count">${g.lessons.length} bài</span><span class="chev"></span></button>
    <ul class="lessons"></ul>`;
  const ul = el.querySelector('ul');
  g.lessons.forEach((l,li)=>{
    const it = document.createElement('li');
    if(!ytId(l.url)) it.classList.add('novideo');
    it.id = `l${gi}_${li}`;
    const b = document.createElement('button');
    b.textContent = l.title;
    b.onclick = ()=>{ select(flat.findIndex(f=>f.gi===gi&&f.li===li)); if(innerWidth<=860) $('stage').scrollIntoView({behavior:'smooth'}); };
    it.appendChild(b); ul.appendChild(it);
  });
  el.querySelector('.head').onclick = ()=>toggle(gi);
  list.appendChild(el);
});

function toggle(gi, force){
  const el = $('g'+gi);
  const open = force ?? !el.classList.contains('open');
  el.classList.toggle('open', open);
  el.querySelector('.head').setAttribute('aria-expanded', open);
}

function select(i){
  if(i<0||i>=flat.length) return;
  cur = i;
  const {gi,li} = flat[i], g = DATA[gi], l = g.lessons[li];
  document.querySelectorAll('.lessons li.active').forEach(x=>x.classList.remove('active'));
  $(`l${gi}_${li}`).classList.add('active');
  DATA.forEach((_,k)=>toggle(k, k===gi));
  $('stage').style.setProperty('--c', g.color);
  $('crumb').textContent = g.name;
  $('title').textContent = l.title;
  const id = ytId(l.url), p = $('player');
  p.innerHTML = '';
  if(id){
    const f = document.createElement('iframe');
    f.src = `https://www.youtube.com/embed/${id}?rel=0`;
    f.title = l.title; f.allowFullscreen = true;
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    p.appendChild(f);
  } else {
    p.innerHTML = '<div class="empty"><div><b>Video đang được cập nhật</b>Bài này chưa có link video. Hãy chọn bài khác ở danh mục bên trái.</div></div>';
  }
  $('prev').disabled = i===0; $('next').disabled = i===flat.length-1;
}
$('prev').onclick = ()=>select(cur-1);
$('next').onclick = ()=>select(cur+1);
$('menuBtn').onclick = ()=>$('side').classList.toggle('collapsed');

select(0);
</script>
</body>
</html>
